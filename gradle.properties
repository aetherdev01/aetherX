# AndroidX
android.useAndroidX=true

# ── Build speed ──────────────────────────────────────────────────────────
# JVM heap lebih besar untuk daemon Gradle & Kotlin compiler — default 512m
# sering jadi bottleneck di module besar (compose + native/cpp di project
# ini). Disesuaikan untuk runner GitHub Actions standar (7GB RAM).
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC

# Jalankan task antar-module yang independen secara paralel.
org.gradle.parallel=true

# Reuse hasil task dari run sebelumnya (build cache lokal ~/.gradle/caches,
# di-restore lewat actions/cache di workflow CI) — task yang inputnya tidak
# berubah (mis. compile module yang tidak disentuh) di-skip, bukan dijalankan
# ulang dari nol.
org.gradle.caching=true

# on-demand: hanya configure module yang benar-benar dibutuhkan task yang
# dijalankan (assembleRelease), bukan semua module di project.
org.gradle.configureondemand=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
