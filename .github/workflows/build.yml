name: AetherX Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AetherX Release
    runs-on: ubuntu-latest

    steps:
      # Checkout source code.
      - name: Checkout Source
        uses: actions/checkout@v4

      # Generate a unique build ID (serial number) for this run, combining
      # a UTC timestamp with the short commit hash. Used later to give each
      # APK output a distinct, traceable filename.
      - name: Generate Build ID
        shell: bash
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y%m%d%H%M%S")
          SHA_SHORT="${GITHUB_SHA:0:7}"
          BUILD_ID="${BUILD_TIMESTAMP}-${SHA_SHORT}"

          echo "Build ID: $BUILD_ID"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      # AetherX uses JDK 17 for the Android release build.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Configure Gradle and enable dependency/task caching.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # Allow the Gradle wrapper to execute on the GitHub runner.
      - name: Grant Gradle Permission
        run: chmod +x ./gradlew

      # AetherX uses Kotlin DSL (.kts); remove obsolete Groovy files
      # that could cause duplicate or conflicting Gradle configuration.
      - name: Clean Legacy Gradle Files
        run: |
          rm -f build.gradle
          rm -f settings.gradle
          rm -f app/build.gradle

          echo "=== Active Gradle files ==="
          find .             \( -name "*.gradle" -o -name "*.gradle.kts" \)             -not -path "./.gradle/*"             | sort

      # Create the release keystore from GitHub Secrets and validate it
      # before Gradle starts. This prevents obscure packageRelease errors.
      - name: Configure Release Signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          echo "=== Checking signing configuration ==="

          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 is empty."; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::KEYSTORE_PASSWORD is empty."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::KEY_ALIAS is empty."; exit 1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::KEY_PASSWORD is empty."; exit 1; }

          echo "Decoding release keystore..."
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/aetherx.jks

          [ -s app/aetherx.jks ] || {
            echo "::error::Decoded keystore is empty."
            exit 1
          }

          echo "Validating keystore..."
          if ! keytool -list             -keystore app/aetherx.jks             -storepass "$KEYSTORE_PASSWORD"             >/tmp/keystore-info.txt 2>/tmp/keystore-error.txt; then
            echo "::error::Unable to open keystore. Check KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            cat /tmp/keystore-error.txt
            exit 1
          fi

          echo "Keystore password is valid."

          echo "Validating key alias..."
          if ! keytool -list             -keystore app/aetherx.jks             -storepass "$KEYSTORE_PASSWORD"             -alias "$KEY_ALIAS"             >/tmp/alias-info.txt 2>/tmp/alias-error.txt; then
            echo "::error::KEY_ALIAS '$KEY_ALIAS' was not found in the keystore."
            cat /tmp/alias-error.txt
            exit 1
          fi

          echo "Key alias is valid: $KEY_ALIAS"

          {
            echo "STORE_FILE=app/aetherx.jks"
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=${KEY_ALIAS}"
            echo "KEY_PASSWORD=${KEY_PASSWORD}"
          } >> local.properties

          echo "Release signing configuration is ready."

      # Compile the signed AetherX release APKs.
      # NOTE: app/build.gradle.kts now enables `splits { abi { ... } }`
      # with isUniversalApk = false, so this produces TWO release APKs
      # (arm64-v8a and armeabi-v7a) instead of one. Everything below this
      # step handles a variable number of output APKs rather than
      # assuming a single file.
      - name: Build Release APKs
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache --parallel

      # Rename each generated APK to a clean filename that keeps the
      # per-ABI suffix so the two files don't collide.
      # Example: AetherX-v1.1-Beta-arm64-v8a.apk, AetherX-v1.1-Beta-armeabi-v7a.apk
      - name: Rename Release APKs
        shell: bash
        run: |
          set -e

          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APK_PATHS < <(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | sort)

          [ "${#APK_PATHS[@]}" -gt 0 ] || {
            echo "::error::No release APKs were found."
            exit 1
          }

          VERSION=$(grep -m1 'versionName' app/build.gradle.kts 2>/dev/null | sed 's/.*= *"//' | sed 's/".*//')

          [ -n "$VERSION" ] || VERSION="Unknown"

          SAFE_VERSION=$(printf '%s' "$VERSION" | sed 's/[^a-zA-Z0-9._-]/-/g')

          FINAL_PATHS=()
          for APK_PATH in "${APK_PATHS[@]}"; do
            BASENAME=$(basename "$APK_PATH")
            ABI=""
            for CANDIDATE in arm64-v8a armeabi-v7a; do
              case "$BASENAME" in
                *"$CANDIDATE"*) ABI="$CANDIDATE" ;;
              esac
            done

            if [ -n "$ABI" ]; then
              FINAL_APK="$APK_DIR/AetherX-v${SAFE_VERSION}-${ABI}-${BUILD_ID}.apk"
            else
              FINAL_APK="$APK_DIR/AetherX-v${SAFE_VERSION}-${BUILD_ID}.apk"
            fi

            mv "$APK_PATH" "$FINAL_APK"
            FINAL_PATHS+=("$FINAL_APK")
            echo "Final APK: $(basename "$FINAL_APK")"
          done

          {
            echo "APK_PATHS<<EOF"
            printf '%s\n' "${FINAL_PATHS[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Store all final APKs as downloadable GitHub Actions artifacts.
      - name: Upload AetherX APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AetherX-v${{ env.VERSION }}-${{ env.BUILD_ID }}
          path: ${{ env.APK_PATHS }}
          if-no-files-found: error
          retention-days: 7

      # Send each final APK to the configured Telegram chat as its own message.
      - name: Send AetherX APKs to Telegram
        if: success()
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          SHA_SHORT="${SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          while IFS= read -r APK_PATH; do
            [ -n "$APK_PATH" ] || continue
            APK_NAME=$(basename "$APK_PATH")
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", ${SIZE_BYTES}/1048576}")

            CAPTION=$(printf '🚀 <b>AetherX Release Build</b>\n\n📦 <b>APK:</b> <code>%s</code>\n🏷 <b>Version:</b> <code>%s</code>\n🆔 <b>Build ID:</b> <code>%s</code>\n💾 <b>Size:</b> <code>%s MB</code>\n🔖 <b>Commit:</b> <code>%s</code>\n\n🔗 <a href="%s">GitHub Actions</a>' "$APK_NAME" "$VERSION" "$BUILD_ID" "$SIZE_MB" "$SHA_SHORT" "$RUN_URL")

            curl -sS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" -F "parse_mode=HTML" -F "caption=${CAPTION}" -F "document=@${APK_PATH}" || true
          done <<< "${{ env.APK_PATHS }}"

      # Notify Telegram if any workflow step fails.
      - name: Telegram Build Failure
        if: failure()
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          SHA_SHORT="${SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          TEXT=$(printf             '❌ <b>AetherX Release Build Failed</b>\n\n🔖 <b>Commit:</b> <code>%s</code>\n\n🔗 <a href="%s">Open build logs</a>'             "$SHA_SHORT" "$RUN_URL")

          curl -sS -X POST             "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"             -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"             -d "parse_mode=HTML"             --data-urlencode "text=${TEXT}"             || true

      # Always remove temporary signing files from the runner.
      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -f app/aetherx.jks
          rm -f local.properties
          echo "Temporary signing files removed."
