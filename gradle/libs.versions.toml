[versions]
agp                     = "8.9.2"
kotlin                  = "2.1.20"

# AndroidX
coreKtx                 = "1.16.0"
appcompat               = "1.7.0"
lifecycleRuntimeKtx     = "2.9.0"
activityCompose         = "1.10.1"
composeBom              = "2025.05.00"
navigationCompose       = "2.9.0"
datastorePreferences    = "1.1.4"
splashscreen            = "1.0.1"
# FITUR BARU (Game Booster — floating sidebar overlay, lihat
# core/overlay/ComposeOverlayLifecycleOwner.kt): dideklarasikan eksplisit
# (bukan hanya transitive lewat lifecycle-runtime-ktx) karena dipakai
# LANGSUNG oleh kode aplikasi (SavedStateRegistryController,
# setViewTreeSavedStateRegistryOwner) untuk menjalankan ComposeView yang
# di-attach manual ke WindowManager dari Service (floating overlay Game
# Booster), bukan dari Activity/Fragment biasa yang sudah otomatis
# menyediakan owner ini.
savedstate              = "1.2.1"

# Compose / UI
material3               = "1.3.2"
icons                   = "1.7.8"

# Kotlin
coroutines              = "1.9.0"

# Privilege backends
# REWORK TOTAL (lihat perintah rework — "buatkan sistem seperti shizuku
# langsung tertanam dalam aplikasinya... hapus semua yang bersangkutan
# dengan shizuku"): dependency Shizuku (dev.rikka.shizuku:api/provider)
# DIHAPUS TOTAL.
#
# KOREKSI PENTING dari versi sebelumnya: "dadb" (dev.mobile:dadb) TERNYATA
# TIDAK menyediakan wireless pairing Android 11+ sama sekali (hanya
# shell/install client ke device yang sudah authorized) — percobaan
# menuliskan protokol pairing (SPAKE2 + TLS custom) dari nol GAGAL karena
# API kriptografinya tidak bisa diverifikasi tanpa akses jaringan penuh.
# Digantikan "libadb-android" (io.github.muntashirakon.adb, oleh pembuat
# App Manager) yang SUDAH mengimplementasikan wireless pairing Android 11+
# secara lengkap dan teruji (dipakai production oleh App Manager sendiri)
# lewat method AbsAdbConnectionManager.pair(host, port, pairingCode) —
# tidak perlu menulis kripto pairing sendiri sama sekali.
libadb                  = "3.1.1"
sunSecurityAndroid      = "1.1"
conscrypt               = "2.5.3"
libsu                   = "6.0.0"

# Firebase (ID pengguna global via Firestore counter)
googleServices          = "4.5.0"
firebaseBom             = "34.15.0"

# Ads (rewarded ads untuk fitur non-member — lihat core/ads/RewardGate.kt)
# CATATAN: "4.+" dipakai (bukan versi patch spesifik) supaya Gradle otomatis
# resolve ke versi mayor-4 TERBARU yang benar-benar ada di Maven Central,
# alih-alih menebak nomor patch tanpa akses internet untuk verifikasi —
# versi sebelumnya ("4.15.1") kemungkinan besar tidak exist dan menyebabkan
# SEMUA `import com.unity3d.ads.*` gagal resolve saat compile (Unresolved
# reference 'unity3d'). Kalau build masih gagal, cek versi konkret yang
# tersedia di https://dashboard.unity3d.com atau search.maven.org
# (com.unity3d.ads:unity-ads) dan ganti "4.+" dengan nomor pasti hasil cek.
unityAds                = "4.+"

[plugins]
android-application     = { id = "com.android.application",             version.ref = "agp"    }
kotlin-android          = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services         = { id = "com.google.gms.google-services",      version.ref = "googleServices" }

[libraries]
# ── Core ─────────────────────────────────────────────────────────────────────
androidx-core-ktx                       = { group = "androidx.core",             name = "core-ktx",                    version.ref = "coreKtx"             }
androidx-appcompat                      = { group = "androidx.appcompat",         name = "appcompat",                   version.ref = "appcompat"           }
androidx-core-splashscreen              = { group = "androidx.core",             name = "core-splashscreen",           version.ref = "splashscreen"        }

# ── Lifecycle ─────────────────────────────────────────────────────────────────
androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",   version.ref = "lifecycleRuntimeKtx" }
androidx-savedstate                     = { group = "androidx.savedstate",       name = "savedstate",                  version.ref = "savedstate"          }

# ── Activity & Navigation ────────────────────────────────────────────────────
androidx-activity-compose               = { group = "androidx.activity",         name = "activity-compose",            version.ref = "activityCompose"     }
androidx-navigation-compose             = { group = "androidx.navigation",       name = "navigation-compose",          version.ref = "navigationCompose"   }

# ── Compose BOM ───────────────────────────────────────────────────────────────
androidx-compose-bom                    = { group = "androidx.compose",          name = "compose-bom",                 version.ref = "composeBom"          }
androidx-ui                             = { group = "androidx.compose.ui",       name = "ui"                                                                }
androidx-ui-graphics                    = { group = "androidx.compose.ui",       name = "ui-graphics"                                                       }
androidx-ui-tooling                     = { group = "androidx.compose.ui",       name = "ui-tooling"                                                        }
androidx-ui-tooling-preview             = { group = "androidx.compose.ui",       name = "ui-tooling-preview"                                                }
androidx-compose-animation              = { group = "androidx.compose.animation",name = "animation"                                                         }
androidx-material3                      = { group = "androidx.compose.material3",name = "material3",                   version.ref = "material3"           }
androidx-material-icons-extended        = { group = "androidx.compose.material", name = "material-icons-extended",     version.ref = "icons"               }

# ── DataStore ─────────────────────────────────────────────────────────────────
androidx-datastore-preferences          = { group = "androidx.datastore",        name = "datastore-preferences",       version.ref = "datastorePreferences"}

# ── Coroutines ────────────────────────────────────────────────────────────────
kotlinx-coroutines-android              = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",  version.ref = "coroutines"          }

# ── Privilege backends: ADB tertanam (no-root, menggantikan Shizuku) ─────────
# "libadb-android" DI-HOST DI JITPACK — WAJIB tambahkan
#     maven { url = uri("https://jitpack.io") }
# di blok `dependencyResolutionManagement.repositories` pada
# settings.gradle.kts (SUDAH ADA di project ini berdasarkan file yang
# pernah dibagikan, jadi seharusnya tidak perlu langkah tambahan).
libadb                                   = { group = "com.github.MuntashirAkon",   name = "libadb-android",             version.ref = "libadb"              }

# sun.security port untuk Android — dipakai untuk generate X509Certificate
# self-signed dari keypair RSA AetherX (Android standar tidak expose
# sun.security.x509 yang dibutuhkan libadb-android untuk membuat sertifikat
# tanpa dependency tambahan ini).
sun-security-android                    = { group = "com.github.MuntashirAkon",   name = "sun-security-android",       version.ref = "sunSecurityAndroid"  }

# Conscrypt — provider TLS 1.3 dipakai libadb-android untuk Wireless
# debugging (pairing & koneksi TLS Android 11+). WAJIB, bukan opsional,
# untuk fitur pairing kode 6-digit.
conscrypt                               = { group = "org.conscrypt",              name = "conscrypt-android",           version.ref = "conscrypt"           }

# ── Privilege backends: root / Magisk / KernelSU / APatch) ───────────
libsu-core                              = { group = "com.github.topjohnwu.libsu", name = "core",                       version.ref = "libsu"               }

# ── Firebase (ID pengguna global via Firestore counter) ─────────────────────
firebase-bom                            = { group = "com.google.firebase",        name = "firebase-bom",               version.ref = "firebaseBom"         }
firebase-analytics                      = { group = "com.google.firebase",        name = "firebase-analytics"                                               }
firebase-firestore                      = { group = "com.google.firebase",        name = "firebase-firestore"                                               }
# Firebase Cloud Messaging — notifikasi push realtime (maintenance/update/
# membership) yang WAJIB tetap sampai walau aplikasi sedang di-background
# atau ditutup total (di-kill dari recent apps), berbeda dari
# MaintenanceRepository/UpdateRepository/LicenseRepository yang pakai
# Firestore addSnapshotListener dan HANYA jalan selagi app punya proses hidup.
firebase-messaging                      = { group = "com.google.firebase",        name = "firebase-messaging"                                               }

# ── Ads: Unity Ads (rewarded ads — lihat core/ads/RewardGate.kt) ────────────
unity-ads                               = { group = "com.unity3d.ads",            name = "unity-ads",                   version.ref = "unityAds"            }
